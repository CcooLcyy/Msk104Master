workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'
    - when: never

stages: [verify-build, publish]

variables:
  R2_BUCKET: mskdsp-update
  R2_PREFIX: msk104master
  R2_PUBLIC_BASE_URL: https://pub-19f3d71852b04011b120b1b814141c12.r2.dev

windows-ci:
  stage: verify-build
  tags: [windows, amd64, shell]
  environment:
    name: ci
    action: prepare
  timeout: 2h
  interruptible: true
  # 主站缓存的准备、编译与回收共用同一互斥边界。
  resource_group: msk104master-windows-cargo
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "20"
    GIT_CLEAN_FLAGS: "-ffdx -e /target/ -e /.ci-tools/"
    CARGO_INCREMENTAL: "0"
    PYTHONUTF8: "1"
    RUST_TOOLCHAIN: "1.97.1"
    MASTER_CARGO_MIN_FREE_GIB: "10"
    MASTER_CARGO_MAX_CACHE_GIB: "20"
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
  script:
    - ./scripts/ci/windows.ps1
  after_script:
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
    - ./scripts/ci/windows.ps1 -Stage cache-finish
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/logs/
      - package/build-info.json
      - package/msk104master.exe
      - package/installer/
      - package/SHA256SUMS.txt
      - package-lock.json
      - Cargo.lock

publish-r2:
  stage: publish
  image:
    name: mskdsp-platform-ci-tools:bookworm-v2
    pull_policy: if-not-present
  tags: [linux, amd64, docker]
  timeout: 20 minutes
  interruptible: false
  resource_group: msk104master-r2-ci
  environment:
    name: ci
  needs:
    - job: windows-ci
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")'
    - when: never
  script:
    - python3 scripts/ci/publish_r2.py
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/latest.json
