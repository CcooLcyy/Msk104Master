workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'
    - when: never

stages: [verify-build]

windows-ci:
  stage: verify-build
  tags: [windows, amd64, shell]
  timeout: 2h
  interruptible: true
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "20"
    GIT_CLEAN_FLAGS: "-ffdx -e /target/ -e /.ci-tools/"
    CARGO_INCREMENTAL: "0"
    PYTHONUTF8: "1"
    RUST_TOOLCHAIN: "1.97.1"
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
  script:
    - ./scripts/ci/windows.ps1
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/logs/
      - package/build-info.json
      - package/msk104master.exe
      - package/SHA256SUMS.txt
      - package-lock.json
      - Cargo.lock
