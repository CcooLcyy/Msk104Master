workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH && $CI_PIPELINE_SOURCE =~ /^(push|web)$/'
    - when: never

stages: [verify-build]

# R2 发布已迁移到 GitHub Actions，此处仅保留未签名检查构建。
windows-ci:
  stage: verify-build
  tags: [windows, amd64, shell]
  environment:
    name: ci
    action: prepare
  timeout: 2h
  interruptible: true
  # 主站缓存的准备、编译与回收共用同一互斥边界。
  resource_group: msk104master-windows-cargo
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_DEPTH: "20"
    GIT_CLEAN_FLAGS: "-ffdx -e /target/ -e /.ci-tools/"
    CARGO_INCREMENTAL: "0"
    PYTHONUTF8: "1"
    RUST_TOOLCHAIN: "1.97.1"
    MASTER_CARGO_MIN_FREE_GIB: "10"
  before_script:
    - '$ErrorActionPreference = "Stop"'
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
  script:
    - ./scripts/ci/windows.ps1
  after_script:
    - if ($env:RUNNER_ENV_PATH) { . $env:RUNNER_ENV_PATH }
    - ./scripts/ci/windows.ps1 -Stage cache-finish
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - package/logs/
      - package/build-info.json
      - package/msk104master.exe
      - package/installer/
      - package/SHA256SUMS.txt
      - package-lock.json
      - Cargo.lock
